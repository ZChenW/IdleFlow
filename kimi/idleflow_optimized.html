<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IdleFlow — 电源策略管理</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #000000;
      --ink-soft: #1A1A1A;
      --muted: #737373;
      --muted-2: #A3A3A3;
      --line: #E5E5E5;
      --line-mid: #D4D4D4;
      --paper: #F7F7F5;
      --white: #FFFFFF;
      --blackbar: #0A0A0A;
    }

    * {
      box-sizing: border-box;
      border-radius: 0 !important;
    }

    html {
      background: #EDEDEB;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background:
        linear-gradient(#EDEDEB 1px, transparent 1px),
        linear-gradient(90deg, #EDEDEB 1px, transparent 1px),
        #F1F1EF;
      background-size: 24px 24px;
      color: var(--ink-soft);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    button, [role="button"], .mode-tab, .slider-handle, .toggle, .sync-check,
    .value-box, .stepper {
      transition:
        color 150ms ease,
        background-color 150ms ease,
        border-color 150ms ease,
        opacity 150ms ease,
        transform 150ms ease;
    }

    .app-window {
      width: min(960px, calc(100vw - 32px));
      background: var(--paper);
      border: 1px solid #BEBEBA;
      overflow: hidden;
    }

    .topbar {
      height: 64px;
      padding: 0 32px;
      background: var(--blackbar);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--ink);
    }

    .brand {
      color: #FFF;
      font-family: Inter, Helvetica, Arial, sans-serif;
      font-size: 52px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 0.9;
      user-select: none;
    }

    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      color: #FFF;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
      background: transparent;
      border: 0;
      cursor: pointer;
    }

    .refresh-btn:hover { opacity: .6; }
    .refresh-btn:active { transform: translateY(1px); }

    .policy-head {
      min-height: 104px;
      padding: 26px 32px 24px;
      background: var(--paper);
      border-bottom: 1px solid var(--ink);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    .policy-title {
      margin: 0;
      color: var(--ink);
      font-size: 20px;
      font-weight: 700;
      line-height: 1.25;
    }

    .policy-subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.5;
    }

    .sync-wrap {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 3px;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      color: var(--ink-soft);
    }

    .sync-check {
      width: 16px;
      height: 16px;
      border: 1px solid var(--ink);
      background: var(--white);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .sync-check svg { opacity: 0; }
    .sync-wrap[data-checked="true"] .sync-check {
      background: var(--ink);
    }
    .sync-wrap[data-checked="true"] .sync-check svg {
      opacity: 1;
    }

    .strategy-shell {
      display: grid;
      grid-template-columns: 80px minmax(0, 1fr);
      background: var(--paper);
    }

    .mode-sidebar {
      border-right: 1px solid var(--line);
      background: #F4F4F2;
    }

    .mode-tab {
      position: relative;
      width: 100%;
      height: 178px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--muted-2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      text-align: center;
      padding: 8px 4px;
    }

    .mode-tab:last-child {
      border-bottom: 0;
    }

    .mode-tab::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: transparent;
      transition: background-color 150ms ease;
    }

    .mode-tab:hover { color: var(--ink); }
    .mode-tab.active {
      color: var(--ink);
      background: #FAFAF8;
    }
    .mode-tab.active::before {
      background: var(--ink);
    }

    .mode-name {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.1;
    }

    .mode-en {
      font-family: Inter, sans-serif;
      color: currentColor;
      opacity: .76;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .08em;
      line-height: 1.2;
      white-space: nowrap;
    }

    .timeline-body {
      min-width: 0;
      background: var(--paper);
    }

    .timeline-row {
      height: 178px;
      position: relative;
      padding: 20px 28px 15px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      opacity: .66;
      transition: opacity 150ms ease, background-color 150ms ease;
      cursor: default;
    }

    .timeline-row:last-child { border-bottom: 0; }
    .timeline-row[data-mode="ac"] { background: #FAFAF9; }
    .timeline-row.active { opacity: 1; }

    .timeline-row.mode-pulse .stage-labels,
    .timeline-row.mode-pulse .value-grid {
      animation: crossFade 150ms ease;
    }

    @keyframes crossFade {
      0% { opacity: .25; transform: translateY(2px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .stage-labels,
    .value-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .stage-labels {
      height: 48px;
      align-items: start;
    }

    .stage-label {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 8px;
      min-width: 0;
    }

    .stage-label-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .stage-cn {
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.15;
      white-space: nowrap;
    }

    .stage-en {
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: .05em;
      white-space: nowrap;
    }

    .track-zone {
      position: relative;
      height: 18px;
      margin: 2px 0 8px;
      user-select: none;
    }

    .track-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 8px;
      height: 2px;
      background: var(--line-mid);
      transition: background-color 150ms ease;
    }

    .timeline-row.active .track-line {
      background: var(--ink);
    }

    .track-arrow {
      position: absolute;
      right: -2px;
      top: 2px;
      color: var(--line-mid);
    }
    .timeline-row.active .track-arrow {
      color: var(--ink);
    }

    .slider-handle {
      position: absolute;
      top: 3px;
      width: 12px;
      height: 12px;
      background: var(--muted-2);
      transform: translateX(-50%);
      cursor: ew-resize;
      z-index: 3;
      touch-action: none;
      transition:
        left 300ms cubic-bezier(0.4, 0, 0.2, 1),
        background-color 150ms ease,
        transform 150ms ease;
    }

    .timeline-row.active .slider-handle {
      background: var(--ink);
    }

    .slider-handle:hover {
      transform: translateX(-50%) scale(1.15);
    }

    .slider-handle.dragging {
      transition: background-color 150ms ease, transform 150ms ease;
      transform: translateX(-50%) scale(1.18);
    }

    .connector {
      position: absolute;
      top: 15px;
      height: 27px;
      border-left: 1px dashed var(--line-mid);
      z-index: 1;
      pointer-events: none;
      transition: left 300ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .connector.dragging {
      transition: none;
    }

    .value-grid {
      position: relative;
      align-items: start;
    }

    .stage-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 0;
      position: relative;
    }

    .stage-control.suspend {
      align-items: flex-start;
    }

    .value-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    .value-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .value-box {
      width: 80px;
      height: 48px;
      position: relative;
      border: 1px solid var(--line);
      background: var(--white);
      display: grid;
      place-items: center;
      cursor: text;
    }

    .value-box:hover,
    .value-box:focus-within {
      border-color: var(--ink);
    }

    .value-field {
      width: 100%;
      outline: none;
      color: var(--ink);
      caret-color: var(--ink);
      font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
      font-size: 32px;
      font-weight: 500;
      line-height: 1;
      text-align: center;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      padding: 4px 16px 4px 4px;
    }

    .value-field::selection {
      background: var(--ink);
      color: var(--white);
    }

    .steppers {
      position: absolute;
      top: 0;
      right: 0;
      width: 16px;
      height: 100%;
      border-left: 1px solid var(--line);
      opacity: 0;
      pointer-events: none;
      background: var(--white);
      display: grid;
      grid-template-rows: 1fr 1fr;
    }

    .value-box:hover .steppers,
    .value-box:focus-within .steppers {
      opacity: 1;
      pointer-events: auto;
    }

    .stepper {
      border: 0;
      background: transparent;
      padding: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      cursor: pointer;
    }

    .stepper:first-child { border-bottom: 1px solid var(--line); }
    .stepper:hover { color: var(--ink); background: #F7F7F5; }

    .unit {
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .05em;
      line-height: 1;
    }

    .toggle-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink-soft);
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .toggle {
      width: 36px;
      height: 20px;
      border: 1px solid var(--line-mid);
      background: var(--white);
      position: relative;
      flex: 0 0 auto;
    }

    .toggle::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      top: 1px;
      left: 1px;
      background: var(--ink);
      transition:
        left 150ms ease,
        background-color 150ms ease;
    }

    .toggle-wrap[data-on="true"] .toggle {
      background: var(--ink);
      border-color: var(--ink);
    }

    .toggle-wrap[data-on="true"] .toggle::after {
      left: 17px;
      background: var(--white);
    }

    .footer {
      height: 56px;
      padding: 0 32px;
      background: var(--white);
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .footer-left {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 12px;
    }

    .inhibitor-copy {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .inhibitor-text {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .inhibitor-title {
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .inhibitor-desc {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .fixed-badge {
      padding: 2px 8px;
      background: #F5F5F5;
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .02em;
      white-space: nowrap;
    }

    .footer-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      flex: 0 0 auto;
    }

    .save-note {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .save-btn {
      min-width: 112px;
      height: 40px;
      padding: 0 24px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--white);
      font-family: Inter, sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .save-btn:hover:not(.saved) {
      background: var(--white);
      color: var(--ink);
      transform: translateY(-1px);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
    }

    .save-btn:active:not(.saved) {
      transform: translateY(0);
    }

    .save-btn.saved {
      background: var(--muted);
      border-color: var(--muted);
      color: var(--white);
      cursor: default;
    }

    .icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .mode-icon {
      width: 22px;
      height: 22px;
    }

    .footer-icon {
      width: 16px;
      height: 16px;
      color: var(--ink);
    }

    @media (max-width: 820px) {
      body { padding: 12px; }
      .app-window { width: calc(100vw - 24px); }
      .topbar { padding: 0 24px; }
      .brand { font-size: 44px; }
      .policy-head { padding-left: 24px; padding-right: 24px; }
      .strategy-shell { grid-template-columns: 72px minmax(0, 1fr); }
      .timeline-row { padding-left: 18px; padding-right: 18px; }
      .value-box { width: 72px; }
      .stage-label { gap: 6px; }
      .footer { padding: 0 24px; }
      .inhibitor-desc { display: none; }
      .save-note { display: none; }
    }

    @media (max-width: 680px) {
      body {
        display: block;
        padding: 0;
        background: var(--paper);
      }
      .app-window {
        width: 100vw;
        min-width: 640px;
        border-left: 0;
        border-right: 0;
      }
    }
  </style>
</head>

<body>
  <main class="app-window" aria-label="IdleFlow 电源策略管理器">
    <!-- 顶部标题栏 -->
    <header class="topbar">
      <div class="brand">IDLEFLOW</div>

      <button id="refreshBtn" class="refresh-btn" type="button" aria-label="刷新已保存策略">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 7v5h-5"></path>
          <path d="M4.8 9A7.5 7.5 0 0 1 18.6 6.3L20 8"></path>
          <path d="M4 17v-5h5"></path>
          <path d="M19.2 15A7.5 7.5 0 0 1 5.4 17.7L4 16"></path>
        </svg>
        <span>刷新</span>
      </button>
    </header>

    <!-- 策略头部 -->
    <section class="policy-head">
      <div>
        <h1 class="policy-title">策略</h1>
        <p class="policy-subtitle">按顺序设置锁屏、熄屏与挂起的等待时间</p>
      </div>

      <button id="syncCheck" class="sync-wrap" type="button" data-checked="false" aria-pressed="false">
        <span class="sync-check" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 10 10">
            <path d="M1.5 5.2 4 7.5 8.5 2.5" fill="none" stroke="#fff" stroke-width="1.4"></path>
          </svg>
        </span>
        <span>已同步</span>
      </button>
    </section>

    <!-- 双模式策略 -->
    <section class="strategy-shell">
      <!-- 左侧模式栏 -->
      <nav class="mode-sidebar" aria-label="电源模式">
        <button class="mode-tab active" type="button" data-target-mode="battery" aria-pressed="true">
          <svg class="icon mode-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="7" width="16" height="10"></rect>
            <path d="M19 10h2v4h-2"></path>
            <path d="M6 10v4"></path>
          </svg>
          <span class="mode-name">电池</span>
          <span class="mode-en">ON BATTERY</span>
        </button>

        <button class="mode-tab" type="button" data-target-mode="ac" aria-pressed="false">
          <svg class="icon mode-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 3v6"></path>
            <path d="M16 3v6"></path>
            <path d="M6 9h12v3a6 6 0 0 1-12 0V9Z"></path>
            <path d="M12 18v3"></path>
          </svg>
          <span class="mode-name">交流电</span>
          <span class="mode-en">PLUGGED IN</span>
        </button>
      </nav>

      <!-- 右侧时间轴 -->
      <div class="timeline-body">
        <!-- 电池模式 -->
        <section class="timeline-row active" data-mode="battery">
          <div class="stage-labels">
            <div class="stage-label">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="6" y="10" width="12" height="10"></rect>
                <path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10"></path>
              </svg>
              <div class="stage-label-text">
                <span class="stage-cn">锁屏</span>
                <span class="stage-en">LOCK</span>
              </div>
            </div>

            <div class="stage-label">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="5" width="16" height="11"></rect>
                <path d="M9 20h6"></path>
                <path d="M12 16v4"></path>
              </svg>
              <div class="stage-label-text">
                <span class="stage-cn">熄屏</span>
                <span class="stage-en">DISPLAY OFF</span>
              </div>
            </div>

            <div class="stage-label">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5Z"></path>
              </svg>
              <div class="stage-label-text">
                <span class="stage-cn">挂起</span>
                <span class="stage-en">SUSPEND</span>
              </div>
            </div>
          </div>

          <div class="track-zone" data-track-mode="battery">
            <div class="track-line"></div>
            <svg class="track-arrow icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5l7 7-7 7"></path>
            </svg>

            <div class="slider-handle" data-mode="battery" data-stage="lock" tabindex="0" role="slider" aria-label="电池模式 锁屏时间"></div>
            <div class="connector" data-mode="battery" data-stage="lock"></div>

            <div class="slider-handle" data-mode="battery" data-stage="display" tabindex="0" role="slider" aria-label="电池模式 熄屏时间"></div>
            <div class="connector" data-mode="battery" data-stage="display"></div>

            <div class="slider-handle" data-mode="battery" data-stage="suspend" tabindex="0" role="slider" aria-label="电池模式 挂起时间"></div>
            <div class="connector" data-mode="battery" data-stage="suspend"></div>
          </div>

          <div class="value-grid">
            <div class="stage-control">
              <div class="value-line">
                <div class="value-box">
                  <div class="value-field" data-mode="battery" data-stage="lock" contenteditable="true" inputmode="numeric" spellcheck="false">10</div>
                  <div class="steppers" aria-hidden="true">
                    <button class="stepper" type="button" data-step="1" tabindex="-1">
                      <svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 5.5 4 2.5l3 3" fill="none" stroke="currentColor" stroke-width="1"/></svg>
                    </button>
                    <button class="stepper" type="button" data-step="-1" tabindex="-1">
                      <svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 2.5 4 5.5l3-3" fill="none" stroke="currentColor" stroke-width="1"/></svg>
                    </button>
                  </div>
                </div>
                <span class="unit">MIN</span>
              </div>
            </div>

            <div class="stage-control">
              <div class="value-line">
                <div class="value-box">
                  <div class="value-field" data-mode="battery" data-stage="display" contenteditable="true" inputmode="numeric" spellcheck="false">15</div>
                  <div class="steppers" aria-hidden="true">
                    <button class="stepper" type="button" data-step="1" tabindex="-1">
                      <svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 5.5 4 2.5l3 3" fill="none" stroke="currentColor" stroke-width="1"/></svg>
                    </button>
                    <button class="stepper" type="button" data-step="-1" tabindex="-1">
                      <svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 2.5 4 5.5l3-3" fill="none" stroke="currentColor" stroke-width="1"/></svg>
                    </button>
                  </div>
                </div>
                <span class="unit">MIN</span>
              </div>
            </div>

            <div class="stage-control suspend">
              <div class="value-stack">
                <div class="value-line">
                  <div class="value-box">
                    <div class="value-field" data-mode="battery" data-stage="suspend" contenteditable="true" inputmode="numeric" spellcheck="false">30</div>
                    <div class="steppers" aria-hidden="true">
                      <button class="stepper" type="button" data-step="1" tabindex="-1">
                        <svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 5.5 4 2.5l3 3" fill="none" stroke="currentColor" stroke-width="1"/></svg>
                      </button>
                      <button class="stepper" type="button" data-step="-1" tabindex="-1">
                        <svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 2.5 4 5.5l3-3" fill="none" stroke="currentColor" stroke-width="1"/></svg>
                      </button>
                    </div>
                  </div>
                  <span class="unit">MIN</span>
                </div>
                <button class="toggle-wrap" type="button" data-mode="battery" data-on="true" aria-pressed="true">
                  <span class="toggle" aria-hidden="true"></span>
                  <span>自动挂起开启</span>
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- 交流电模式 -->
        <section class="timeline-row" data-mode="ac">
          <div class="stage-labels">
            <div class="stage-label">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="6" y="10" width="12" height="10"></rect>
                <path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10"></path>
              </svg>
              <div class="stage-label-text">
                <span class="stage-cn">锁屏</span>
                <span class="stage-en">LOCK</span>
              </div>
            </div>

            <div class="stage-label">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="5" width="16" height="11"></rect>
                <path d="M9 20h6"></path>
                <path d="M12 16v4"></path>
              </svg>
              <div class="stage-label-text">
                <span class="stage-cn">熄屏</span>
                <span class="stage-en">DISPLAY OFF</span>
              </div>
            </div>

            <div class="stage-label">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5Z"></path>
              </svg>
              <div class="stage-label-text">
                <span class="stage-cn">挂起</span>
                <span class="stage-en">SUSPEND</span>
              </div>
            </div>
          </div>

          <div class="track-zone" data-track-mode="ac">
            <div class="track-line"></div>
            <svg class="track-arrow icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5l7 7-7 7"></path>
            </svg>

            <div class="slider-handle" data-mode="ac" data-stage="lock" tabindex="0" role="slider" aria-label="交流电模式 锁屏时间"></div>
            <div class="connector" data-mode="ac" data-stage="lock"></div>

            <div class="slider-handle" data-mode="ac" data-stage="display" tabindex="0" role="slider" aria-label="交流电模式 熄屏时间"></div>
            <div class="connector" data-mode="ac" data-stage="display"></div>

            <div class="slider-handle" data-mode="ac" data-stage="suspend" tabindex="0" role="slider" aria-label="交流电模式 挂起时间"></div>
            <div class="connector" data-mode="ac" data-stage="suspend"></div>
          </div>

          <div class="value-grid">
            <div class="stage-control">
              <div class="value-line">
                <div class="value-box">
                  <div class="value-field" data-mode="ac" data-stage="lock" contenteditable="true" inputmode="numeric" spellcheck="false">120</div>
                  <div class="steppers" aria-hidden="true">
                    <button class="stepper" type="button" data-step="5" tabindex="-1">
                      <svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 5.5 4 2.5l3 3" fill="none" stroke="currentColor" stroke-width="1"/></svg>
                    </button>
                    <button class="stepper" type="button" data-step="-5" tabindex="-1">
                      <svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 2.5 4 5.5l3-3" fill="none" stroke="currentColor" stroke-width="1"/></svg>
                    </button>
                  </div>
                </div>
                <span class="unit">MIN</span>
              </div>
            </div>

            <div class="stage-control">
              <div class="value-line">
                <div class="value-box">
                  <div class="value-field" data-mode="ac" data-stage="display" contenteditable="true" inputmode="numeric" spellcheck="false">160</div>
                  <div class="steppers" aria-hidden="true">
                    <button class="stepper" type="button" data-step="5" tabindex="-1">
                      <svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 5.5 4 2.5l3 3" fill="none" stroke="currentColor" stroke-width="1"/></svg>
                    </button>
                    <button class="stepper" type="button" data-step="-5" tabindex="-1">
                      <svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 2.5 4 5.5l3-3" fill="none" stroke="currentColor" stroke-width="1"/></svg>
                    </button>
                  </div>
                </div>
                <span class="unit">MIN</span>
              </div>
            </div>

            <div class="stage-control suspend">
              <div class="value-stack">
                <div class="value-line">
                  <div class="value-box">
                    <div class="value-field" data-mode="ac" data-stage="suspend" contenteditable="true" inputmode="numeric" spellcheck="false">200</div>
                    <div class="steppers" aria-hidden="true">
                      <button class="stepper" type="button" data-step="5" tabindex="-1">
                        <svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 5.5 4 2.5l3 3" fill="none" stroke="currentColor" stroke-width="1"/></svg>
                      </button>
                      <button class="stepper" type="button" data-step="-5" tabindex="-1">
                        <svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 2.5 4 5.5l3-3" fill="none" stroke="currentColor" stroke-width="1"/></svg>
                      </button>
                    </div>
                  </div>
                  <span class="unit">MIN</span>
                </div>
                <button class="toggle-wrap" type="button" data-mode="ac" data-on="true" aria-pressed="true">
                  <span class="toggle" aria-hidden="true"></span>
                  <span>自动挂起开启</span>
                </button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </section>

    <!-- 底部操作栏 -->
    <footer class="footer">
      <div class="footer-left">
        <svg class="icon footer-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3 19 6v5c0 5-3 8-7 10-4-2-7-5-7-10V6l7-3Z"></path>
          <path d="m9 12 2 2 4-5"></path>
        </svg>

        <div class="inhibitor-copy">
          <div class="inhibitor-text">
            <span class="inhibitor-title">遵守应用 inhibitor</span>
            <span class="inhibitor-desc">演示、媒体播放和会议可以延后空闲动作</span>
          </div>
          <span class="fixed-badge">固定启用</span>
        </div>
      </div>

      <div class="footer-right">
        <span class="save-note">保存但不改变所有权</span>
        <button id="saveBtn" class="save-btn" type="button">保存策略</button>
      </div>
    </footer>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "idleflow.strategy.v1";

      const defaults = {
        battery: {
          lock: { value: 10, min: 1, max: 30, step: 1 },
          display: { value: 15, min: 1, max: 60, step: 1 },
          suspend: { value: 30, min: 5, max: 120, step: 1 },
          autoSuspend: true
        },
        ac: {
          lock: { value: 120, min: 1, max: 240, step: 5 },
          display: { value: 160, min: 1, max: 300, step: 5 },
          suspend: { value: 200, min: 5, max: 480, step: 5 },
          autoSuspend: true
        },
        synced: false,
        activeMode: "battery"
      };

      const deepClone = (obj) => JSON.parse(JSON.stringify(obj));
      let state = deepClone(defaults);

      const stageIndex = { lock: 0, display: 1, suspend: 2 };

      const $ = (sel, root = document) => root.querySelector(sel);
      const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function getConfig(mode, stage) {
        return state[mode][stage];
      }

      function positionPercent(mode, stage) {
        const cfg = getConfig(mode, stage);
        const normalized = (cfg.value - cfg.min) / (cfg.max - cfg.min || 1);
        const local = 0.15 + clamp(normalized, 0, 1) * 0.70;
        return ((stageIndex[stage] + local) / 3) * 100;
      }

      function setValue(mode, stage, value, { dragging = false } = {}) {
        const cfg = getConfig(mode, stage);
        const next = clamp(Math.round(Number(value) || cfg.min), cfg.min, cfg.max);
        cfg.value = next;

        const field = $(`.value-field[data-mode="${mode}"][data-stage="${stage}"]`);
        const handle = $(`.slider-handle[data-mode="${mode}"][data-stage="${stage}"]`);
        const connector = $(`.connector[data-mode="${mode}"][data-stage="${stage}"]`);

        if (field && document.activeElement !== field) field.textContent = String(next);
        if (field) {
          field.setAttribute("aria-valuemin", cfg.min);
          field.setAttribute("aria-valuemax", cfg.max);
          field.setAttribute("aria-valuenow", next);
        }

        const pct = positionPercent(mode, stage);
        if (handle) {
          handle.style.left = `${pct}%`;
          handle.setAttribute("aria-valuemin", cfg.min);
          handle.setAttribute("aria-valuemax", cfg.max);
          handle.setAttribute("aria-valuenow", next);
          handle.classList.toggle("dragging", dragging);
        }
        if (connector) {
          connector.style.left = `${pct}%`;
          connector.classList.toggle("dragging", dragging);
        }
      }

      function renderMode(mode) {
        ["lock", "display", "suspend"].forEach(stage => {
          const field = $(`.value-field[data-mode="${mode}"][data-stage="${stage}"]`);
          if (field) field.textContent = String(getConfig(mode, stage).value);
          setValue(mode, stage, getConfig(mode, stage).value);
        });

        const toggle = $(`.toggle-wrap[data-mode="${mode}"]`);
        if (toggle) {
          const on = Boolean(state[mode].autoSuspend);
          toggle.dataset.on = String(on);
          toggle.setAttribute("aria-pressed", String(on));
        }
      }

      function setActiveMode(mode, animate = true) {
        state.activeMode = mode;

        $$(".mode-tab").forEach(tab => {
          const active = tab.dataset.targetMode === mode;
          tab.classList.toggle("active", active);
          tab.setAttribute("aria-pressed", String(active));
        });

        $$(".timeline-row").forEach(row => {
          const active = row.dataset.mode === mode;
          row.classList.toggle("active", active);

          if (active && animate) {
            row.classList.remove("mode-pulse");
            void row.offsetWidth;
            row.classList.add("mode-pulse");
            setTimeout(() => row.classList.remove("mode-pulse"), 170);
          }
        });
      }

      function renderSync() {
        const sync = $("#syncCheck");
        sync.dataset.checked = String(Boolean(state.synced));
        sync.setAttribute("aria-pressed", String(Boolean(state.synced)));
      }

      function renderAll({ animateMode = false } = {}) {
        renderMode("battery");
        renderMode("ac");
        renderSync();
        setActiveMode(state.activeMode || "battery", animateMode);
      }

      function safeLoad() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (!stored) {
            state = deepClone(defaults);
            return;
          }
          const parsed = JSON.parse(stored);

          ["battery", "ac"].forEach(mode => {
            ["lock", "display", "suspend"].forEach(stage => {
              const cfg = defaults[mode][stage];
              const incoming = parsed?.[mode]?.[stage]?.value;
              state[mode][stage] = { ...cfg, value: clamp(Number(incoming) || cfg.value, cfg.min, cfg.max) };
            });
            state[mode].autoSuspend = parsed?.[mode]?.autoSuspend ?? defaults[mode].autoSuspend;
          });

          state.synced = parsed?.synced ?? false;
          state.activeMode = parsed?.activeMode === "ac" ? "ac" : "battery";
        } catch {
          state = deepClone(defaults);
        }
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function selectAllText(el) {
        const range = document.createRange();
        range.selectNodeContents(el);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }

      // 模式切换：保留两行同时可见，但通过激活态与 150ms 交叉淡入突出当前模式。
      $$(".mode-tab").forEach(tab => {
        tab.addEventListener("click", () => setActiveMode(tab.dataset.targetMode, true));
      });

      $$(".timeline-row").forEach(row => {
        row.addEventListener("mousedown", (e) => {
          if (e.target.closest(".slider-handle, .value-field, .stepper, .toggle-wrap")) return;
          setActiveMode(row.dataset.mode, true);
        });
      });

      // 同步复选框
      $("#syncCheck").addEventListener("click", () => {
        state.synced = !state.synced;
        renderSync();
      });

      // 自动挂起 toggle
      $$(".toggle-wrap").forEach(toggle => {
        toggle.addEventListener("click", () => {
          const mode = toggle.dataset.mode;
          setActiveMode(mode, true);
          state[mode].autoSuspend = !state[mode].autoSuspend;
          toggle.dataset.on = String(state[mode].autoSuspend);
          toggle.setAttribute("aria-pressed", String(state[mode].autoSuspend));
        });
      });

      // 数值输入
      $$(".value-field").forEach(field => {
        const mode = field.dataset.mode;
        const stage = field.dataset.stage;

        field.addEventListener("focus", () => {
          setActiveMode(mode, true);
          requestAnimationFrame(() => selectAllText(field));
        });

        field.addEventListener("beforeinput", (e) => {
          if (e.data && /[^\d]/.test(e.data)) {
            e.preventDefault();
          }
        });
        field.addEventListener("input", () => {
          if (field.textContent.length > 4) {
            field.textContent = field.textContent.slice(0, 4);
          }
        });

        field.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            field.blur();
          }
          if (e.key === "ArrowUp" || e.key === "ArrowDown") {
            e.preventDefault();
            const cfg = getConfig(mode, stage);
            const delta = e.key === "ArrowUp" ? cfg.step : -cfg.step;
            setValue(mode, stage, cfg.value + delta);
            field.textContent = String(cfg.value);
            selectAllText(field);
          }
        });

        field.addEventListener("blur", () => {
          const cfg = getConfig(mode, stage);
          const parsed = parseInt(field.textContent, 10);
          const next = Number.isFinite(parsed) ? parsed : cfg.value;
          setValue(mode, stage, next);
          field.textContent = String(cfg.value);
        });
      });

      // 微调箭头
      $$(".value-box").forEach(box => {
        const field = $(".value-field", box);
        const mode = field.dataset.mode;
        const stage = field.dataset.stage;

        $$(".stepper", box).forEach(stepper => {
          stepper.addEventListener("mousedown", (e) => e.preventDefault());
          stepper.addEventListener("click", () => {
            setActiveMode(mode, true);
            const cfg = getConfig(mode, stage);
            const delta = Number(stepper.dataset.step || cfg.step);
            setValue(mode, stage, cfg.value + delta);
            field.textContent = String(cfg.value);
          });
        });
      });

      // 滑块拖动 + 键盘
      $$(".slider-handle").forEach(handle => {
        const mode = handle.dataset.mode;
        const stage = handle.dataset.stage;

        handle.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          setActiveMode(mode, true);
          handle.setPointerCapture(e.pointerId);
          handle.classList.add("dragging");
          const connector = $(`.connector[data-mode="${mode}"][data-stage="${stage}"]`);
          connector?.classList.add("dragging");
        });

        handle.addEventListener("pointermove", (e) => {
          if (!handle.hasPointerCapture(e.pointerId)) return;

          const track = $(`.track-zone[data-track-mode="${mode}"]`);
          const rect = track.getBoundingClientRect();
          const segW = rect.width / 3;
          const idx = stageIndex[stage];
          const xInSeg = e.clientX - rect.left - idx * segW;
          const ratio = clamp(xInSeg / segW, 0.15, 0.85);
          const normalized = (ratio - 0.15) / 0.70;

          const cfg = getConfig(mode, stage);
          const raw = cfg.min + normalized * (cfg.max - cfg.min);
          const stepped = Math.round(raw / cfg.step) * cfg.step;
          setValue(mode, stage, stepped, { dragging: true });

          const field = $(`.value-field[data-mode="${mode}"][data-stage="${stage}"]`);
          if (field) field.textContent = String(cfg.value);
        });

        const endDrag = (e) => {
          if (handle.hasPointerCapture?.(e.pointerId)) {
            handle.releasePointerCapture(e.pointerId);
          }
          handle.classList.remove("dragging");
          const connector = $(`.connector[data-mode="${mode}"][data-stage="${stage}"]`);
          connector?.classList.remove("dragging");
          setValue(mode, stage, getConfig(mode, stage).value);
        };

        handle.addEventListener("pointerup", endDrag);
        handle.addEventListener("pointercancel", endDrag);

        handle.addEventListener("keydown", (e) => {
          const cfg = getConfig(mode, stage);
          if (e.key === "ArrowLeft" || e.key === "ArrowDown") {
            e.preventDefault();
            setActiveMode(mode, true);
            setValue(mode, stage, cfg.value - cfg.step);
          }
          if (e.key === "ArrowRight" || e.key === "ArrowUp") {
            e.preventDefault();
            setActiveMode(mode, true);
            setValue(mode, stage, cfg.value + cfg.step);
          }
        });
      });

      // 保存
      const saveBtn = $("#saveBtn");
      let saveTimer = null;

      saveBtn.addEventListener("click", () => {
        saveState();

        clearTimeout(saveTimer);
        saveBtn.classList.add("saved");
        saveBtn.textContent = "已保存 ✓";
        saveBtn.disabled = true;

        saveTimer = setTimeout(() => {
          saveBtn.classList.remove("saved");
          saveBtn.textContent = "保存策略";
          saveBtn.disabled = false;
        }, 1500);
      });

      // 刷新：恢复到最后一次保存；若未保存则恢复默认值。
      $("#refreshBtn").addEventListener("click", () => {
        safeLoad();
        renderAll({ animateMode: true });
      });

      window.addEventListener("resize", () => {
        ["battery", "ac"].forEach(mode => {
          ["lock", "display", "suspend"].forEach(stage => {
            setValue(mode, stage, getConfig(mode, stage).value);
          });
        });
      });

      safeLoad();
      renderAll();
    })();
  </script>
</body>
</html>
